[project]
name = "scrybuy-api"
version = "2.0.0"
description = "ScryBuy API for vendor information"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "ijson>=3.4.0.post0",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "ruff>=0.14.10",
    "slowapi>=0.1.9",
    "uvicorn>=0.40.0",
]

[project.scripts]
fetch-card-kingdom-prices = "scrybuy_api.main:fetch_card_kingdom_prices"
fetch-mana-pool-prices = "scrybuy_api.main:fetch_mana_pool_prices"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrybuy_api"]
